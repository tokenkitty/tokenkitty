version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # tools/doctor runs fixed developer tools found on PATH
      - path: tools/doctor/
        linters: [gosec]
        text: G204

formatters:
  enable:
    - gofmt
    - goimports
